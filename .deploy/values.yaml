serviceName: client-frontend
namespace: martketplace-vkr

replicas: 1

containerPort: 80

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 32Mi

ingress:
  enabled: true
  host: client-frontend-marketplace.vitalmeuble.online
  port: 80
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - client-frontend-marketplace.vitalmeuble.online
      secretName: client-frontend-marketplace-vitalmeuble-tls
